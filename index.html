<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/app-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GuessWhoDaily | Identify the notable names & faces in history</title>

    <style>
      body {
        /* font-family: sans-serif; */
        font-family: Arial, Geneva, Tahoma, sans-serif;
        text-align: center;
        /* margin: 0.5rem auto; */
        margin: 0 auto;
        padding: 4px;
        /*
* Created with https://www.css-gradient.com
* Gradient link: https://www.css-gradient.com/?c1=47d1ba&c2=f1ffad&gt=l&gd=dbr
*/
        background: #47d1ba;
        background: linear-gradient(135deg, #47d1ba, #f1ffad);
        background-attachment: fixed;
      }
      /* img {
        max-width: 300px;
        margin: 1rem auto;
        display: block;
        transition: filter 0.5s ease;
      } */

      #appName {
        color: rgb(65, 58, 58);
        text-decoration: none;
        font-weight: 600;
      }

      button {
        margin: 0.5rem;
        padding: 0.5rem 1rem;
        border: none;
        background-color: black;
        color: white;
      }
      button:hover {
        cursor: pointer;
        background-color: white;
        color: black;
        border: 1px solid black;
      }
      .guessButton {
        background-color: green;
        color: white;
        border: none;
      }
      .guessButton:hover {
        background-color: white;
        color: green;
        border: 1px solid green;
      }
      input {
        padding: 6px;
        margin: 4px;
      }
      span {
        cursor: pointer;
        text-decoration: underline;
        color: brown;
      }
      /* footer {
        position: fixed;
        bottom: 5px;
        left: 10%;
        margin: 4px;
        font-size: small;
      } */
      nav {
        position: fixed;
        top: 0;
        left: 5%;
        margin: 12px;
        font-size: small;
        display: flex;
        justify-content: space-around;
        align-items: center;
        z-index: 300;
      }
      nav a {
        text-decoration: none;
        margin: auto 8px;
        color: rgb(250, 247, 247);
        font-weight: 700;
        text-shadow: 1px 2px 2px green;
      }
      nav a:hover {
        color: #750d0d;
        text-decoration: underline;
      }
      nav img:hover {
        cursor: pointer;
      }

      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        /* left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto; */
        inset: 0; /* short for top/right/bottom/left:0 */
        background-color: rgba(0, 0, 0, 0.4);
        opacity: 0; /* start invisible */
        transition: opacity 0.3s ease; /* fade effect */
      }
      .modal.show {
        display: block;
        opacity: 1; /* fade to visible */
      }
      .modal.hide {
        opacity: 0;
      }

      .modal-content {
        background-color: #fff;
        margin: 5% auto;
        padding: 0; /* allows iframe fit cleanly */
        border-radius: 8px;
        width: 90%;
        max-width: 900px;
        height: 80vh; /* fixed viewport height */
        display: flex;
        flex-direction: column;
        overflow: hidden; /* contain iframe scroll */
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        animation: slideDown 0.3s ease; /* optional slide effect */
      }

      @keyframes slideDown {
        from {
          transform: translateY(-20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .close-button {
        color: red;
        position: absolute;
        top: 2%;
        right: 10%;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
      }

      .modal-content iframe {
        flex: 1; /* take remaining space */
        width: 100%;
        border: none;
        overflow-y: auto; /* vertical scroll only */
      }
      #loadingIframe {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        /* display: none;  */
        /* Hidden by default */
      }
      .challenge-div {
        margin-top: 6%;
      }
      .about-div {
        margin: 6% auto;
        padding: 12px;
        width: 320px;
        height: auto;
      }
      /* .img-logo {
        margin-top: 6%;
      } */
      .app-title {
        margin-top: 8%;
      }

      .dashboard-div {
        margin: 6% auto;
        padding: 12px;
        width: 320px;
        height: auto;
      }
      .policy-div {
        margin: 6% auto;
        padding: 12px;
        width: 320px;
        height: auto;
      }
      .history-div {
        width: 100%;
        /* background-color: rgb(236, 236, 228); */
        padding: 6px;
        margin-top: 6%;
      }

      /** */
      #joystick {
        position: absolute;
        bottom: 20px;
        left: 20px;
        width: 120px;
        height: 120px;
        border: 2px solid #aaa;
        border-radius: 50%;
        touch-action: none;
        display: none; /* hidden by default */
      }
      #stick {
        position: absolute;
        width: 40px;
        height: 40px;
        background: #666;
        border-radius: 50%;
        left: 40px;
        top: 40px;
      }
      /** */
      .b-carousel {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        width: 100%;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
      }

      .b-item {
        min-width: 100%;
        height: 68px;
        padding: 8px;
        margin: 6px;
        /* background-color: rgb(252, 181, 169); */
        background-color: rgb(8, 107, 21);
        scroll-snap-align: start;
        color: white;
      }
      .b-item a {
        color: rgb(248, 119, 97);
      }
      .d-item {
        min-width: 100%;
        height: 68px;
        padding: 8px;
        margin: 6px;
        background-color: rgb(134, 130, 132);
        color: white;
        scroll-snap-align: start;
      }
      .e-item {
        min-width: 100%;
        height: 150px;
        padding: 8px;
        margin: 6px;
        background-color: rgb(197, 77, 137);
        color: rgb(248, 248, 246);
        scroll-snap-align: start;
      }

      /* categories grid */
      /* .grid-wrapper {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
      } */
      .grid-wrapper {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
      }

      .category {
        position: relative;
        width: 120px;
        height: 120px;
        /* width: 140px;
        height: 140px; */
        margin-top: 5%;
        background-size: cover;
        background-position: center;
        /* border-radius: 8px; */
        border: 6px solid #fff; /* white border like a photo */
        border-bottom: 20px solid #fff; /* thicker bottom edge for polaroid feel */
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3); /* drop shadow */
        cursor: pointer;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        /* color: white; */
        color: #750d0d;
        font-weight: bold;
        font-size: 1.2em;
        /* text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
        transition: transform 0.3s ease; */
        text-shadow: 0 3px 6px rgba(255, 255, 255, 0.9);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
        background-color: #fff; /* ensures border blends with background */
      }

      /* Tilt effect */
      .category:nth-child(odd) {
        transform: rotate(-4deg);
      }
      .category:nth-child(even) {
        transform: rotate(4deg);
      }

      .category:hover {
        transform: scale(1.1) rotate(0deg);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        z-index: 1;
      }

      @media screen and (max-width: 600px) {
        .challenge-div {
          margin-top: 32%;
        }
        .category {
          margin-top: 2%;
        }
        .headDiv {
          margin-top: 21%;
        }
        /* .img-logo {
          margin-top: 13%;
        } */
        .app-title {
          margin-top: 20%;
        }
        .img-logo {
          margin-top: 20%;
        }
        .dashboard-h2 {
          margin-top: 38%;
          font-family: Arial, Helvetica, sans-serif;
        }
        .about-div {
          margin-top: 25%;
        }
        .policy-div {
          margin-top: 25%;
        }
        .history-div {
          position: absolute;
          left: 0;
          top: 10%;
        }
        #feedToHomeBtn {
          position: fixed;
          top: 10%;
          right: 35%;
          z-index: 100;
        }
      }
      /* style="position:absolute;top:5%;left:3%;z-index:100" */
    </style>
    <!-- Confetti.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  </head>
